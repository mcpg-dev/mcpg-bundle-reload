[package]
name = "mcpg-bundle-reload"
version = "0.1.0-beta.13"
license = "Apache-2.0"
edition = "2024"
description = "Shared bundle hot-reload helper for MCPG plugins"


[lib]

[dependencies]
arc-swap = "1"
metrics = "0.24"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["rt", "time", "fs", "macros", "sync"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
